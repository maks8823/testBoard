<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images/hash.svg">
  <link rel="stylesheet" href="css/style.css">
  <title>Board</title>
</head>
<body>
  <nav>
    <a href="index.html">Главная</a>
    <a href="admin.html" id="nav-admin" style="display:none;">Админка</a>
    <a href="login.html" id="nav-auth">Войти</a>
  </nav>

  <div class="container">
    <h1>idk</h1>
    <hr style="margin: 2rem 0; border: 0; border-top: 1px solid rgba(255,255,255,0.1);">
    <h2>Новости и события</h2>
    <div id="news-list">Загрузка новостей...</div>
  </div>

  <script type="module">
    import { auth, db } from "./js/firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { isAdmin } from "./js/user-role.js";

    let currentUserIsAdmin = false;

    function linkify(text) {
      if (!text) return "";
      const safe = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      return safe.replace(/(https?:\/\/[^\s]+)/g,
        url => `<a href="${url}" target="_blank" rel="noopener" style="color:#8ec8f8;">${url}</a>`);
    }

    onAuthStateChanged(auth, async (user) => {
      const navAuth = document.getElementById("nav-auth");
      const navAdmin = document.getElementById("nav-admin");

      if (user) {
        if (navAuth) {
          navAuth.textContent = `Выйти (${user.email})`;
          navAuth.href = "#";
          navAuth.onclick = (e) => {
            e.preventDefault();
            signOut(auth).then(() => location.reload());
          };
        }
        currentUserIsAdmin = await isAdmin(user);
        if (currentUserIsAdmin && navAdmin) {
          navAdmin.style.display = "inline-block";
        }
      } else {
        currentUserIsAdmin = false;
      }
      loadNews();
    });

    async function loadNews() {
      const list = document.getElementById("news-list");
      if (!list) return;

      try {
        const snap = await getDocs(collection(db, "news"));
        if (snap.empty) {
          list.innerHTML = "<p>Новостей пока нет.</p>";
          return;
        }

        const arr = [];
        snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
        arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        list.innerHTML = arr.map(d => `
          <article class="card">
            <h3>${d.title || "Без названия"}</h3>
            <p style="margin:8px 0; white-space:pre-wrap;">${linkify(d.text)}</p>
            <small style="color:#7eb8e0;">${new Date(d.createdAt || 0).toLocaleString()}</small>
            ${currentUserIsAdmin
              ? `<div style="margin-top:10px;">
                   <button class="btn-danger" data-del="${d.id}">Удалить запись</button>
                 </div>`
              : ""}
          </article>
        `).join("");

        list.querySelectorAll("[data-del]").forEach(btn => {
          btn.onclick = async () => {
            if (!confirm("Удалить эту запись?")) return;
            try {
              await deleteDoc(doc(db, "news", btn.dataset.del));
              loadNews();
            } catch (e) {
              alert("Недостаточно прав для удаления этой записи: " + e.message);
            }
          };
        });
      } catch (e) {
        list.innerHTML = `<p class="error">Ошибка загрузки новостей: ${e.message}</p>`;
      }
    }
  </script>
</body>
</html>
